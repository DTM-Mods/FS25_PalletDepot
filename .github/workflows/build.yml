# Checks the mod on every push and pull request, and publishes a release when you push a tag
# v<version in modDesc.xml>. The steps live in DTM-Mods/.github (.github/workflows/fs25-mod.yml).
# This file is the same in every DTM mod repository; only the settings under "with:" differ.
#
# Try a release without publishing it: Actions > Build > Run workflow, enter the tag (v1.2.0.0).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      test-tag:
        description: "Try a release without publishing it: the tag, e.g. v1.2.0.0 (leave empty to just build)"
        type: string
        default: ""

permissions:
  contents: write     # publish releases on tags
  actions: write      # start the Discord release post

jobs:
  mod:
    uses: DTM-Mods/.github/.github/workflows/fs25-mod.yml@main
    with:
      test-tag: ${{ inputs.test-tag || '' }}
      # Settings for this mod (see DTM-Mods/.github ci/README.md):
      # Logistics Hub ships the same build under two names: FS25_LogisticsHub.zip (new name) and
      # FS25_PalletDepot.zip (old name, so savegames that already have it keep their buildings).
      # products.py needs the game install and the FedMods zips, so CI uses the committed build/products.json.
      zip-name: FS25_LogisticsHub
      zips: FS25_LogisticsHub FS25_PalletDepot
      build-command: |
        python tools/build_mod.py --ci
        cp build/FS25_LogisticsHub.zip build/FS25_PalletDepot.zip dist/
        git diff --exit-code -- placeables vehicles || { echo "::error::placeables/ or vehicles/ differ from what the generators write; run tools/build_mod.py and commit"; exit 1; }
      # the scripts' offline tests (tests/*_test.lua with the engine stubbed, run on lupa)
      test-command: python3 tests/run_tests.py
      install-note: |
        **Which zip?** Both are the same build.
        - `FS25_PalletDepot.zip`: for a savegame that already has the mod. It keeps the old file name, so the hubs you already own stay.
        - `FS25_LogisticsHub.zip`: the new name, for a new map or a new savegame.

        Put only **one** of them into the mods folder, never both.
